name: Build Fonts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Build fonts
        run: make fonts

      - name: Build samples
        run: make samples

      - name: Run tests
        run: make test

      - name: Zip Heiti TTFs
        run: zip -j NanGuo-Heiti-Fonts.zip fonts/Heiti/ttf/*.ttf

      - name: Zip Songti TTFs
        run: zip -j NanGuo-Songti-Fonts.zip fonts/Songti/ttf/*.ttf

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "NanGuo Pinyin Fonts ${{ github.ref_name }} (${{ github.sha }})"
          tag_name: "build-${{ github.run_number }}"
          body_path: documentation/release_draft.md
          files: |
            NanGuo-Heiti-Fonts.zip
            NanGuo-Songti-Fonts.zip
            fonts/Heiti/ttf/*.ttf
            fonts/Songti/ttf/*.ttf
            fonts/Heiti/ttc/NanGuoHeitiPinyin.ttc
            fonts/Songti/ttc/NanGuoSongtiPinyin.ttc
            documentation/NanGuo_Specimen_Heiti.png
            documentation/NanGuo_Specimen_Songti.png
            documentation/NanGuo_Demo_Heiti.pdf
            documentation/NanGuo_Demo_Heiti.png
            documentation/NanGuo_Demo_Songti.pdf
            documentation/NanGuo_Demo_Songti.png
            documentation/NanGuo_Poem_XiangSi.pdf
            documentation/NanGuo_Poem_XiangSi.png
